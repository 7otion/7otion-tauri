[package]
name = "harness"
version = "0.0.0"
description = "The plugin behind a mock Tauri app, so the TypeScript tests reach it as the app does."
edition = "2024"
publish = false

[dependencies]
tauri-plugin-7otion-sqlite = { path = ".." }
tauri = { version = "2.11", default-features = false, features = ["test"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.6", default-features = false }
